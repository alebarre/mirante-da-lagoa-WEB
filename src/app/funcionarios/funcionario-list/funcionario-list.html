<div class="page">
  <h2>👷 Funcionários</h2>
  <button class="btn-primary" (click)="newItem()">Novo Funcionário</button>

  <div class="error" *ngIf="error">{{ error }}</div>
  <div *ngIf="loading">Carregando...</div>

  <table class="data-table" *ngIf="!loading">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Cargo</th>
        <th>Departamento</th>
        <th>Telefone</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.fullName }}</td>
        <td>{{ item.position || '-' }}</td>
        <td>{{ item.department || '-' }}</td>
        <td>{{ item.phone || '-' }}</td>
        <td class="actions">
          <button (click)="edit(item.id)">Editar</button>
          <button class="btn-danger" (click)="remove(item.id)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
