<div class="page">
  <h2>
    <i class="fas {{ id ? 'fa-edit' : 'fa-plus' }}"></i>
    {{ id ? 'Editar' : 'Novo' }} Funcionario
  </h2>

  <form [formGroup]="form" (ngSubmit)="save()">
    <h3><i class="fas fa-user"></i> Dados pessoais</h3>
    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Nome completo *</label>
        <input formControlName="fullName" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-id-card"></i> CPF</label>
        <input formControlName="cpf" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-passport"></i> RG</label>
        <input formControlName="rg" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-birthday-cake"></i> Data de nascimento</label>
        <input type="date" formControlName="birthDate" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-phone"></i> Telefone</label>
        <input formControlName="phone" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> E-mail</label>
        <input type="email" formControlName="email" />
      </div>
    </div>

    <div class="form-group">
      <label><i class="fas fa-map-marker-alt"></i> Endereco</label>
      <input formControlName="address" />
    </div>

    <h3><i class="fas fa-briefcase"></i> Dados profissionais</h3>
    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-briefcase"></i> Cargo</label>
        <input formControlName="position" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-building"></i> Departamento</label>
        <input formControlName="department" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-calendar-check"></i> Data de admissao</label>
        <input type="date" formControlName="hireDate" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-calendar-times"></i> Data de demissao</label>
        <input type="date" formControlName="terminationDate" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-money-bill-wave"></i> Salario</label>
        <input type="number" step="0.01" formControlName="salary" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-clock"></i> Regime</label>
        <select formControlName="workRegime">
          <option value="">Selecione</option>
          <option value="CLT">CLT</option>
          <option value="PJ">PJ</option>
          <option value="ESTAGIARIO">Estagiario</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label><i class="fas fa-university"></i> Dados bancarios</label>
      <input formControlName="bankAccount" />
    </div>

    <h3><i class="fas fa-calculator"></i> Encargos e beneficios mensais</h3>
    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-shield-alt"></i> INSS patronal</label>
        <input type="number" step="0.01" formControlName="inssEmployer" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-piggy-bank"></i> FGTS</label>
        <input type="number" step="0.01" formControlName="fgts" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-file-invoice-dollar"></i> IRRF</label>
        <input type="number" step="0.01" formControlName="irrf" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-bus"></i> Vale transporte</label>
        <input type="number" step="0.01" formControlName="transportAllowance" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-utensils"></i> Vale alimentacao/refeicao</label>
        <input type="number" step="0.01" formControlName="mealAllowance" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-heartbeat"></i> Plano de saude</label>
        <input type="number" step="0.01" formControlName="healthInsurance" />
      </div>
    </div>

    <div class="form-group">
      <label><i class="fas fa-plus-circle"></i> Outros beneficios</label>
      <input type="number" step="0.01" formControlName="otherBenefits" />
    </div>

    <h3><i class="fas fa-piggy-bank"></i> Provisoes trabalhistas mensais</h3>
    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-calendar"></i> 13º salario</label>
        <input type="number" step="0.01" formControlName="thirteenthSalaryProvision" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-umbrella-beach"></i> Ferias</label>
        <input type="number" step="0.01" formControlName="vacationProvision" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-umbrella-beach"></i> 1/3 de ferias</label>
        <input type="number" step="0.01" formControlName="vacationThirdProvision" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-exclamation-triangle"></i> Multa rescisoria estimada</label>
        <input type="number" step="0.01" formControlName="severanceFineProvision" />
      </div>
    </div>

    <h3><i class="fas fa-history"></i> Historico de ocorrencias</h3>
    <div formArrayName="ocorrencias">
      <div class="ocorrencia-item" *ngFor="let ocorrencia of ocorrencias.controls; let i = index" [formGroupName]="i">
        <div class="form-row">
          <div class="form-group">
            <label><i class="fas fa-tag"></i> Tipo</label>
            <select formControlName="tipo">
              <option *ngFor="let tipo of ocorrenciaTipos" [value]="tipo">{{ tipo }}</option>
            </select>
          </div>
          <div class="form-group">
            <label><i class="fas fa-calendar"></i> Data</label>
            <input type="date" formControlName="data" />
          </div>
        </div>
        <div class="form-group">
          <label><i class="fas fa-align-left"></i> Descricao</label>
          <textarea formControlName="descricao" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label><i class="fas fa-paperclip"></i> Anexo (URL)</label>
          <input formControlName="anexo" />
        </div>
        <button type="button" class="btn-danger" (click)="removeOcorrencia(i)">
          <i class="fas fa-trash-alt"></i> Remover ocorrencia
        </button>
      </div>
    </div>

    <button type="button" class="btn-secondary" (click)="addOcorrencia()">
      <i class="fas fa-plus"></i> Adicionar ocorrencia
    </button>

    <div class="form-group">
      <label><i class="fas fa-sticky-note"></i> Observacoes gerais</label>
      <textarea formControlName="notes" rows="3"></textarea>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="loading">
        <i class="fas" [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-save'"></i>
        {{ loading ? 'Salvando...' : 'Salvar' }}
      </button>
      <button type="button" (click)="router.navigate(['/funcionarios'])">
        <i class="fas fa-times"></i> Cancelar
      </button>
      <button type="button" class="btn-back" (click)="router.navigate(['/funcionarios'])">
        <i class="fas fa-arrow-left"></i> Voltar
      </button>
    </div>
  </form>
</div>
