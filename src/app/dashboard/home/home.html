<button class="menu-toggle" (click)="toggleSidebar()" aria-label="Menu">
  <i class="fas fa-bars"></i>
</button>

<div class="dashboard">
  <aside class="sidebar" [class.open]="sidebarOpen">
    <div class="brand">
      <img src="/images/coqueiro-branco.png" alt="Mirante da Lagoa" class="brand-logo" />
      <h3>Mirante da Lagoa</h3>
      <small>Saquarema/RJ</small>
    </div>

    <nav class="menu">
      <a *ngFor="let item of menu" [routerLink]="item.path" routerLinkActive="active" (click)="closeSidebar()">
        <i class="fas {{ item.icon }}"></i> {{ item.label }}
      </a>
    </nav>

    <div class="user-info">
      <strong>{{ auth?.fullName }}</strong>
      <small>{{ auth?.role }}</small>
      <button (click)="logout()" class="btn-logout">
        <i class="fas fa-sign-out-alt"></i> Sair
      </button>
    </div>
  </aside>

  <main class="content">
    <h1><img src="/images/coqueiro-transparente.png" alt="Mirante da Lagoa" class="welcome-logo" /> Bem-vindo, {{ auth?.fullName || 'Usuário' }}!</h1>
    <p>Escolha uma opção no menu ao lado para começar.</p>

    <div class="dashboard-cards">
      <a *ngFor="let card of dashboardCards" [routerLink]="card.path" class="dashboard-card">
        <i class="fas {{ card.icon }}"></i>
        <h4>{{ card.label }}</h4>
      </a>
    </div>
  </main>
</div>
