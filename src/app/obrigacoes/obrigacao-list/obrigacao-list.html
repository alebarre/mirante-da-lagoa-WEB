<div class="page">
  <div class="page-header">
    <h2><i class="fas fa-clipboard-check"></i> Obrigações Trabalhistas</h2>
    <button class="btn-primary" (click)="newItem()" *ngIf="canManage">
      <i class="fas fa-plus"></i> Nova Obrigação
    </button>
  </div>

  <div class="loading" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i> Carregando...
  </div>

  <div class="empty-state" *ngIf="!loading && items.length === 0">
    <i class="fas fa-clipboard-list"></i>
    <p>Nenhuma obrigação cadastrada.</p>
  </div>

  <div class="filters-bar" *ngIf="!loading && items.length > 0">
    <div class="filter-group search">
      <i class="fas fa-search"></i>
      <input type="text" [(ngModel)]="searchText" (input)="applyFilter()" placeholder="Buscar por nome, descrição, periodicidade ou responsável..." />
    </div>

    <div class="filter-group" *ngIf="statuses.length > 0">
      <select [(ngModel)]="filterStatus" (change)="applyFilter()">
        <option value="">Todos os status</option>
        <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
      </select>
    </div>

    <button class="btn-clear" *ngIf="searchText || filterStatus" (click)="clearFilters()">
      <i class="fas fa-times"></i> Limpar
    </button>
  </div>

  <div class="empty-state" *ngIf="!loading && items.length > 0 && filteredItems.length === 0">
    <i class="fas fa-search"></i>
    <p>Nenhuma obrigação encontrada para os filtros aplicados.</p>
  </div>

  <div class="cards-grid" *ngIf="!loading && filteredItems.length > 0">
    <div class="obrigacao-card" *ngFor="let item of filteredItems; trackBy: trackById" (click)="selectItem(item)" [class.selected]="selectedId === item.id">
      <div class="card-header">
        <i class="fas fa-clipboard-check"></i>
        <h3>{{ item.name }}</h3>
        <span class="status-badge" *ngIf="item.status">{{ item.status }}</span>
      </div>

      <div class="card-body">
        <div class="info-row">
          <span class="info-label"><i class="fas fa-sync"></i> Periodicidade</span>
          <span class="info-value">{{ item.periodicity }}</span>
        </div>

        <div class="info-row">
          <span class="info-label"><i class="fas fa-calendar-day"></i> Vencimento</span>
          <span class="info-value">{{ item.dueDate | date:'dd/MM/yyyy' }}</span>
        </div>

        <div class="info-row">
          <span class="info-label"><i class="fas fa-user-tie"></i> Responsável</span>
          <span class="info-value">{{ item.responsible || '-' }}</span>
        </div>
      </div>

      <div class="card-footer" *ngIf="canManage" (click)="$event.stopPropagation()">
        <button (click)="edit(item.id)" title="Editar" class="btn-action">
          <i class="fas fa-edit"></i>
          <span class="btn-text">Editar</span>
        </button>
        <button class="btn-danger btn-action" (click)="remove(item.id)" title="Excluir">
          <i class="fas fa-trash-alt"></i>
          <span class="btn-text">Excluir</span>
        </button>
      </div>
    </div>
  </div>

  <div class="page-footer">
    <button type="button" class="btn-back" (click)="router.navigate(['/dashboard'])">
      <i class="fas fa-arrow-left"></i> Voltar
    </button>
  </div>
</div>
