<div class="page">
  <h2>
    <i class="fas {{ id ? 'fa-edit' : 'fa-plus' }}"></i>
    {{ id ? 'Editar' : 'Nova' }} Obrigação Trabalhista
  </h2>

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="form-group">
      <label><i class="fas fa-heading"></i> Nome *</label>
      <input formControlName="name" />
    </div>

    <div class="form-group">
      <label><i class="fas fa-align-left"></i> Descrição</label>
      <textarea formControlName="description" rows="2"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-sync"></i> Periodicidade</label>
        <select formControlName="periodicity">
          <option value="MENSAL">Mensal</option>
          <option value="TRIMESTRAL">Trimestral</option>
          <option value="SEMESTRAL">Semestral</option>
          <option value="ANUAL">Anual</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-calendar-day"></i> Vencimento</label>
        <input type="date" formControlName="dueDate" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-check-circle"></i> Concluído em</label>
        <input type="date" formControlName="completedAt" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-user"></i> Responsável</label>
        <input formControlName="responsible" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-tag"></i> Status</label>
        <select formControlName="status">
          <option value="PENDENTE">Pendente</option>
          <option value="EM_DIA">Em dia</option>
          <option value="ATRASADO">Atrasado</option>
          <option value="CANCELADO">Cancelado</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label><i class="fas fa-sticky-note"></i> Observações</label>
      <textarea formControlName="notes" rows="2"></textarea>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="loading">
        <i class="fas" [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-save'"></i>
        {{ loading ? 'Salvando...' : 'Salvar' }}
      </button>
      <button type="button" (click)="router.navigate(['/obrigacoes'])">
        <i class="fas fa-times"></i> Cancelar
      </button>
      <button type="button" class="btn-back" (click)="router.navigate(['/obrigacoes'])">
        <i class="fas fa-arrow-left"></i> Voltar
      </button>
    </div>
  </form>
</div>
