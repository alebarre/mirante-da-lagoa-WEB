<div class="auth-container">
  <div class="auth-card">
    <h2><i class="fas fa-lock-open"></i> Redefinir Senha</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> E-mail</label>
        <input type="email" formControlName="email" />
      </div>

      <div class="form-group">
        <label><i class="fas fa-hashtag"></i> Código de 5 dígitos</label>
        <input type="text" formControlName="code" maxlength="5" />
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Nova senha</label>
        <input type="password" formControlName="newPassword" />
      </div>

      <button type="submit" [disabled]="loading" class="btn-primary">
        <i class="fas" [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-save'"></i>
        {{ loading ? 'Redefinindo...' : 'Redefinir senha' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login"><i class="fas fa-sign-in-alt"></i> Voltar ao login</a>
    </div>
  </div>
</div>
