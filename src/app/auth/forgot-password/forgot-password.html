<div class="auth-container">
  <div class="auth-card">
    <h2><i class="fas fa-key"></i> Recuperar Senha</h2>
    <p class="subtitle">Informe seu e-mail para receber o código de redefinição.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> E-mail</label>
        <input type="email" formControlName="email" placeholder="seu@email.com" />
      </div>

      <button type="submit" [disabled]="loading" class="btn-primary">
        <i class="fas" [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>
        {{ loading ? 'Enviando...' : 'Enviar código' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login"><i class="fas fa-sign-in-alt"></i> Voltar ao login</a>
    </div>
  </div>
</div>
