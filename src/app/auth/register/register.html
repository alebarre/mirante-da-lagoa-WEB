<div class="auth-container">
  <div class="auth-card">
    <h2><i class="fas fa-user-plus"></i> Criar Conta</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Nome completo</label>
        <input type="text" formControlName="fullName" />
      </div>

      <div class="form-group">
        <label><i class="fas fa-envelope"></i> E-mail</label>
        <input type="email" formControlName="email" />
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Senha</label>
        <input type="password" formControlName="password" />
      </div>

      <div class="form-group">
        <label><i class="fas fa-id-badge"></i> Perfil</label>
        <select formControlName="role">
          <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
        </select>
      </div>

      <button type="submit" [disabled]="loading" class="btn-primary">
        <i class="fas" [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-save'"></i>
        {{ loading ? 'Cadastrando...' : 'Cadastrar' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login"><i class="fas fa-sign-in-alt"></i> Já tenho conta</a>
    </div>
  </div>
</div>
