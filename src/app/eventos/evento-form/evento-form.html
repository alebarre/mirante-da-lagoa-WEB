<div class="page">
  <h2>
    <i class="fas {{ id ? 'fa-edit' : 'fa-plus' }}"></i>
    {{ id ? 'Editar' : 'Novo' }} Evento
  </h2>

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="form-group">
      <label><i class="fas fa-heading"></i> Titulo *</label>
      <input formControlName="title" />
    </div>

    <div class="form-group">
      <label><i class="fas fa-align-left"></i> Descricao</label>
      <textarea formControlName="description" rows="2"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-hourglass-start"></i> Inicio</label>
        <input type="datetime-local" formControlName="startAt" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-hourglass-end"></i> Termino</label>
        <input type="datetime-local" formControlName="endAt" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-map-marker-alt"></i> Local</label>
        <select formControlName="location">
          <option value="">Selecione</option>
          <option value="Salão de festas">Salao de festas</option>
          <option value="Piscina">Piscina</option>
          <option value="Área comum">Area comum</option>
          <option value="Churrasqueira">Churrasqueira</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-user-tie"></i> Organizador</label>
        <input formControlName="organizer" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fas fa-tag"></i> Status</label>
        <select formControlName="status">
          <option value="AGENDADO">Agendado</option>
          <option value="CONFIRMADO">Confirmado</option>
          <option value="CANCELADO">Cancelado</option>
          <option value="REALIZADO">Realizado</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-users"></i> Max. participantes</label>
        <input type="number" formControlName="maxParticipants" />
      </div>
    </div>

    <div class="form-group checkbox">
      <label>
        <input type="checkbox" formControlName="restrictedToResidents" />
        <i class="fas fa-lock"></i> Restrito a moradores
      </label>
    </div>

    <div class="form-group">
      <label><i class="fas fa-sticky-note"></i> Observacoes</label>
      <textarea formControlName="notes" rows="2"></textarea>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="loading">
        <i class="fas" [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-save'"></i>
        {{ loading ? 'Salvando...' : 'Salvar' }}
      </button>
      <button type="button" (click)="router.navigate(['/eventos'])">
        <i class="fas fa-times"></i> Cancelar
      </button>
      <button type="button" class="btn-back" (click)="router.navigate(['/eventos'])">
        <i class="fas fa-arrow-left"></i> Voltar
      </button>
    </div>
  </form>
</div>
