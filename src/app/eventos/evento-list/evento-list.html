<div class="page">
  <div class="page-header">
    <h2><i class="fas fa-glass-cheers"></i> Eventos</h2>
    <button class="btn-primary" (click)="newItem()" *ngIf="!isMorador">
      <i class="fas fa-plus"></i> Novo Evento
    </button>
  </div>

  <div class="loading" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i> Carregando...
  </div>

  <div class="empty-state" *ngIf="!loading && items.length === 0">
    <i class="fas fa-calendar-plus"></i>
    <p>Nenhum evento cadastrado.</p>
  </div>

  <div class="table-wrapper" *ngIf="!loading && items.length > 0">
    <table class="data-table">
      <thead>
        <tr>
          <th>Título</th>
          <th>Início</th>
          <th>Término</th>
          <th>Local</th>
          <th>Status</th>
          <th class="col-actions" *ngIf="!isMorador">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items">
          <td>{{ item.title }}</td>
          <td>{{ item.startAt | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ item.endAt | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ item.location || '-' }}</td>
          <td>{{ item.status || '-' }}</td>
          <td class="table-actions" *ngIf="!isMorador">
            <button (click)="edit(item.id)" title="Editar" class="btn-action">
              <i class="fas fa-edit"></i>
              <span class="btn-text">Editar</span>
            </button>
            <button class="btn-danger btn-action" (click)="remove(item.id)" title="Excluir">
              <i class="fas fa-trash-alt"></i>
              <span class="btn-text">Excluir</span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="page-footer">
    <button type="button" class="btn-back" (click)="router.navigate(['/dashboard'])">
      <i class="fas fa-arrow-left"></i> Voltar
    </button>
  </div>
</div>
