<div class="page">
  <div class="page-header">
    <h2><i class="fas fa-home"></i> Moradores</h2>
    <button class="btn-primary" (click)="newItem()" *ngIf="!isMorador">
      <i class="fas fa-plus"></i> Novo Morador
    </button>
  </div>

  <div class="loading" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i> Carregando...
  </div>

  <div class="empty-state" *ngIf="!loading && items.length === 0">
    <i class="fas fa-house-user"></i>
    <p>Nenhum morador cadastrado.</p>
  </div>

  <div class="filters-bar" *ngIf="!loading && items.length > 0">
    <div class="filter-group search">
      <i class="fas fa-search"></i>
      <input type="text" [(ngModel)]="searchText" (input)="applyFilter()" placeholder="Buscar por nome, e-mail, telefone, CPF, bloco ou contato de emergência..." />
    </div>

    <div class="filter-group" *ngIf="apartments.length > 0">
      <select [(ngModel)]="filterApartment" (change)="applyFilter()">
        <option value="">Todos os apartamentos</option>
        <option *ngFor="let a of apartments" [value]="a">{{ a }}</option>
      </select>
    </div>

    <button class="btn-clear" *ngIf="searchText || filterApartment" (click)="clearFilters()">
      <i class="fas fa-times"></i> Limpar
    </button>
  </div>

  <div class="empty-state" *ngIf="!loading && items.length > 0 && filteredItems.length === 0">
    <i class="fas fa-search"></i>
    <p>Nenhum morador encontrado para os filtros aplicados.</p>
  </div>

  <div class="cards-grid" *ngIf="!loading && filteredItems.length > 0">
    <div class="morador-card" *ngFor="let item of filteredItems; trackBy: trackById" (click)="selectItem(item)" [class.selected]="selectedId === item.id">
      <div class="card-header">
        <i class="fas fa-home"></i>
        <h3>{{ item.fullName }}</h3>
        <span class="owner-badge" *ngIf="item.owner">Proprietário</span>
      </div>

      <div class="card-body">
        <div class="info-row">
          <span class="info-label"><i class="fas fa-building"></i> Bloco</span>
          <span class="info-value">{{ item.block }}</span>
        </div>

        <div class="info-row">
          <span class="info-label"><i class="fas fa-door-closed"></i> Apartamento</span>
          <span class="info-value">{{ item.apartment }}</span>
        </div>

        <div class="info-row">
          <span class="info-label"><i class="fas fa-phone"></i> Telefone</span>
          <span class="info-value">{{ item.phone || '-' }}</span>
        </div>

        <div class="info-row">
          <span class="info-label"><i class="fas fa-envelope"></i> E-mail</span>
          <span class="info-value">{{ item.email || '-' }}</span>
        </div>
      </div>

      <div class="card-footer" *ngIf="!isMorador" (click)="$event.stopPropagation()">
        <button (click)="edit(item.id)" title="Editar" class="btn-action">
          <i class="fas fa-edit"></i>
          <span class="btn-text">Editar</span>
        </button>
        <button class="btn-danger btn-action" (click)="remove(item.id)" title="Excluir">
          <i class="fas fa-trash-alt"></i>
          <span class="btn-text">Excluir</span>
        </button>
      </div>
    </div>
  </div>

  <div class="page-footer">
    <button type="button" class="btn-back" (click)="router.navigate(['/dashboard'])">
      <i class="fas fa-arrow-left"></i> Voltar
    </button>
  </div>
</div>
